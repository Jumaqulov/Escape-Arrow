<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EEF2F8" />
    <meta name="description" content="Arrow Escape - a minimalist tap puzzle. Clear every arrow off the board." />
    <title>Arrow Escape</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #EEF2F8; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center;
             font-family: "Nunito", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
             -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      #game { width: 100%; height: 100%; }
      #game canvas { display: block; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              color: #9AA3B5; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
